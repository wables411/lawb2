[build]
  publish = "dist"
  functions = "functions"

[build.environment]
  NODE_VERSION = "20"
  # Exclude ClawbWorld from Netlify: no world bundle, no world-only assets — saves build credits
  VITE_EXCLUDE_WORLD = "true"

[[redirects]]
  from = "/api/game-monitor"
  to = "/.netlify/functions/game-monitor"
  status = 200

[[redirects]]
  from = "/api/alchemy-nft"
  to = "/.netlify/functions/alchemy-nft"
  status = 200

[[redirects]]
  from = "/api/game-monitor-simple"
  to = "/.netlify/functions/game-monitor-simple"
  status = 200

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.well-known/acme-challenge/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/world-assets/zips/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-json/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/cgi-bin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.svn/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.hg/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/vendor/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/boaform/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/HNAP1"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/autodiscover/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server-status"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/actuator/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_profiler/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_ignition/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  targetPort = 5173 