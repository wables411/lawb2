[build]
  publish = "dist"
  functions = "functions"
  # Skip the build (exit 0 = skip) when the push touched nothing the site is built from.
  # Saves build credits on pushes that only change docs, the ELO indexer, droplet
  # scripts, contract runbooks, etc.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ public/ functions/ scripts/ index.html package.json package-lock.json vite.config.ts tsconfig.json netlify.toml _headers _redirects"

[build.environment]
  NODE_VERSION = "20"
  # Exclude ClawbWorld from Netlify: no world bundle, no world-only assets — saves build credits
  VITE_EXCLUDE_WORLD = "true"
  # On-chain wager chess (Arbitrum/$DMT launch 2026-07-20) — adds the opt-in tab on /chess
  VITE_ONCHAIN_CHESS = "true"

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

