[build]
  publish = "dist"
  functions = "functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/stockfish"
  to = "/.netlify/functions/stockfish"
  status = 200

[[redirects]]
  from = "/api/game-monitor"
  to = "/.netlify/functions/game-monitor"
  status = 200

[[redirects]]
  from = "/api/alchemy-nft"
  to = "/.netlify/functions/alchemy-nft"
  status = 200

[[redirects]]
  from = "/api/game-monitor-simple"
  to = "/.netlify/functions/game-monitor-simple"
  status = 200

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.well-known/acme-challenge/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/world-assets/zips/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  targetPort = 5173 