version: '3.8'

services:
  chess-api:
    build:
      context: .
      dockerfile: Dockerfile.chess-api
    container_name: chess-stockfish-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/stockfish"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

